function brand(right){return `<div class="topline"><span class="brand"><i></i>Minicons Animated</span><span class="mono edition">${right}</span></div>`}
const smooth=x=>x*x*(3-2*x),mod=(a,b)=>(a%b+b)%b;
const wallpaper=['joyful','loved','surprised','curious','happy','cheeky','starstruck','cold-face','thinking','cool','laughing','face-in-clouds','pleading','winking','saluting','ecstatic','heartbroken','loudly-crying','dizzy','clown','astonished','shushing','peeking','nauseated','vomiting','silly','angry','bashful','blowing-a-kiss','sleeping','monocle','rolling-laughter','nerd','mischievous','hugging','woozy','angelic','celebrating','nervous','bittersweet','unimpressed','overheated','zany','amused'];
const tint=['#eeeee5','#e9eee5','#f1e7df','#e5ecee','#ede7ee','#f1eddf'];
let updateScene;
if(scene==='wall'){
 let tiles='',n=0;
 for(let r=0;r<6;r++)for(let c=0;c<8;c++){
  if((r===2||r===3)&&(c===3||c===4))continue;
  const id=wallpaper[n%wallpaper.length];
  tiles+=`<div class="tile" style="left:${c*156}px;top:${r*156}px;background:${tint[(r*3+c)%tint.length]}">${face(id,'',n*.117)}</div>`;n++;
 }
 const heroes=['celebrating','loved','beaming'];
 tiles+=`<div class="tile big" style="left:468px;top:312px"><span class="hero-number">MINICONS / IN MOTION</span>${heroes.map(id=>`<div class="hero-group">${face(id,'hero')}<div class="hero-label">${assets[id].name}</div></div>`).join('')}</div>`;
 stage.innerHTML=brand('112 expressions · endless moods')+`<div class="wall-window"><div class="world">${tiles}</div></div><div class="wall-footer"><span class="tagline">Small faces. Full feelings.</span><div class="footer-dots"><i></i><i></i><i></i></div></div>`;
 const world=document.querySelector('.world'),groups=[...document.querySelectorAll('.hero-group')],dots=[...document.querySelectorAll('.footer-dots i')];
 updateScene=t=>{
  const p=TAU*t/duration,scale=.925+.035*Math.cos(p);
  world.style.transform=`translate(${480-618+29*Math.sin(p)}px,${204-462+16*Math.sin(p*2)}px) rotate(${-4+1.3*Math.sin(p)}deg) scale(${scale})`;
  const k=Math.floor(t/3.2)%3,part=mod(t,3.2),blend=part>2.65?smooth((part-2.65)/.55):0;
  groups.forEach((e,i)=>{const op=i===k?1-blend:i===(k+1)%3?blend:0;e.style.opacity=op;e.style.transform=`scale(${.94+.06*op})`;e.style.transformOrigin='150px 150px'});
  dots.forEach((e,i)=>e.classList.toggle('on',i===k));
 };
}else if(scene==='closeup'){
 const ids=['celebrating','loudly-crying','dizzy','cold-face','face-in-clouds','astonished'];
 stage.innerHTML=brand('Motion study / 02')+`<h1 class="title">Big feelings.</h1><div class="close-kicker">Every little detail, in motion.</div><div class="close-ring"></div><div class="halo"></div><i class="spark"></i><i class="spark s2"></i>${ids.map(id=>`<div class="close-panel">${face(id)}<div class="close-name">${assets[id].name}</div></div>`).join('')}<div class="close-caption"><span class="mono">Small faces. Full feelings.</span><span class="bars">${ids.map(()=>'<i></i>').join('')}</span></div>`;
 const panels=[...document.querySelectorAll('.close-panel')],bars=[...document.querySelectorAll('.bars i')],halo=document.querySelector('.halo');
 const colors=['#f0e8d8','#e6ebed','#ece6ef','#e6edef','#e7ecec','#f1e7db'];
 function mix(a,b,n){let q=[1,3,5].map(i=>Math.round(parseInt(a.slice(i,i+2),16)*(1-n)+parseInt(b.slice(i,i+2),16)*n).toString(16).padStart(2,'0'));return '#'+q.join('')}
 updateScene=t=>{
  const v=t/1.6,k=Math.floor(v)%6,part=mod(t,1.6),blend=part>.99?smooth((part-.99)/.61):0;
  panels.forEach((el,i)=>{let d=mod(i-k+3,6)-3;let x=(d-blend)*610;let opacity=Math.max(0,1-Math.abs(d-blend));let s=1-.12*Math.min(1,Math.abs(d-blend));el.style.transform=`translateX(${x}px) scale(${s})`;el.style.opacity=opacity;el.style.transformOrigin='360px 385px'});
  bars.forEach((e,i)=>e.classList.toggle('on',i===k));halo.style.background=mix(colors[k],colors[(k+1)%6],blend);halo.style.transform=`scale(${1+.025*Math.sin(TAU*t/4.8)})`;
 };
}else{
 const ids=['celebrating','saluting','thinking','shushing','peeking','clown','dizzy','cold-face'];
 stage.innerHTML=brand('<span class="orbit-pill">112 different moods</span>')+`<h1 class="title orbit-title">Mood, meet motion.</h1><div class="orbit-ring"></div><div class="orbit-ring inner"></div><div class="orbit-halo"></div>${face('happy','orbit-center')}<div class="orbit-label">In good company</div>${ids.map((id,i)=>face(id,'satellite',i*.31)).join('')}${Array.from({length:12},(_,i)=>`<i class="fleck" style="background:${['#248c37','#f9ac1b','#1988e3','#ec94ac'][i%4]}"></i>`).join('')}<div class="orbit-footer mono"><span>Minimal emoticons</span><span>Maximum feeling</span></div>`;
 const satellites=[...document.querySelectorAll('.satellite')],flecks=[...document.querySelectorAll('.fleck')],center=document.querySelector('.orbit-center');
 updateScene=t=>{
  const p=TAU*t/duration;
  satellites.forEach((e,i)=>{const a=i*TAU/8+p,r=1+.023*Math.sin(p*2+i);const x=360+258*Math.cos(a)*r,y=405+220*Math.sin(a)*r;const s=.94+.055*Math.sin(a);e.style.transform=`translate(${x-50}px,${y-50}px) rotate(${5*Math.sin(p*2+i)}deg) scale(${s})`;e.style.zIndex=10+Math.round(5*Math.sin(a))});
  flecks.forEach((e,i)=>{const a=i*TAU/12-p;const r=i%2?168:188;const x=360+r*Math.cos(a),y=405+r*.9*Math.sin(a);e.style.transform=`translate(${x}px,${y}px) rotate(${i*40+360*t/duration}deg)`;e.style.opacity=.3+.35*(.5+.5*Math.sin(p*2+i))});
  center.style.transform=`rotate(${3*Math.sin(p*2)}deg) scale(${1+.025*Math.sin(p*2)})`;
 };
}
const animations=document.getAnimations().map(a=>({a,phase:Number(a.effect.target.closest('[data-phase]')?.dataset.phase||0)*1000}));
animations.forEach(({a})=>a.pause());
window.renderAt=t=>{t=mod(t,duration);animations.forEach(({a,phase})=>a.currentTime=t*1000+phase);updateScene(t)};
renderAt(0);
if(!new URLSearchParams(location.search).has('capture')){const start=performance.now();function tick(now){renderAt((now-start)/1000);requestAnimationFrame(tick)}requestAnimationFrame(tick)}
window.sceneReady=true;
</script></body></html>
