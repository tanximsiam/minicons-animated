<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-dazed" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Dazed"><style>.f-dazed .pose{transform-origin:32px 34px;animation:f-dazed-pose 2.4s ease-in-out infinite}@keyframes f-dazed-pose{0%,100%{transform:translate(-.7px,0) rotate(-3deg)}50%{transform:translate(.7px,1px) rotate(3deg)}}.f-dazed .orbit-0{transform-origin:0 0;animation:f-dazed-orbit-0 1.2s linear infinite}@keyframes f-dazed-orbit-0{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.f-dazed .orbit-1{transform-origin:0 0;animation:f-dazed-orbit-1 1.2s linear infinite}@keyframes f-dazed-orbit-1{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}.f-dazed .orbit-1{animation-delay:-.3s}@media(prefers-reduced-motion:reduce){.f-dazed *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B6A5D4" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="3.4" ry="3.8" fill="#DFF0EC" class=""/><g class="pupil orbit orbit-0"><ellipse cx="0" cy="-1.5" rx="1.55" ry="1.55" fill="#2C0E0F" class=""/></g></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="3.4" ry="3.8" fill="#DFF0EC" class=""/><g class="pupil orbit orbit-1"><ellipse cx="0" cy="-1.5" rx="1.55" ry="1.55" fill="#2C0E0F" class=""/></g></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><ellipse cx="0" cy="0" rx="1.8" ry="2" fill="#2C0E0F" class=""/></g></g></g></svg>