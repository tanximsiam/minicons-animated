<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-crying" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Crying"><style>.f-crying .pose{transform-origin:32px 34px;animation:f-crying-pose 2.4s ease-in-out infinite}@keyframes f-crying-pose{0%,100%{transform:translateY(0)}15%,48%{transform:translateY(1.2px)}30%,64%{transform:translateY(-.3px)}80%{transform:translateY(.4px)}}.f-crying .brows{animation:f-crying-brows 4.8s ease-in-out infinite}@keyframes f-crying-brows{0%,100%{transform:translateY(0)}40%,70%{transform:translateY(-.55px)}}.f-crying .lip-motion{transform-origin:0 0;animation:f-crying-lip-motion 2.4s ease-in-out infinite}@keyframes f-crying-lip-motion{0%,65%,100%{transform:translateX(0)}20%,36%,52%{transform:translateX(-.35px)}28%,44%,60%{transform:translateX(.35px)}}.f-crying .tear-drop{transform-origin:44px 35px;animation:f-crying-tear-drop 2.4s ease-in infinite}@keyframes f-crying-tear-drop{0%,12%{transform:translateY(-1px) scaleY(.5);opacity:0}24%{transform:translateY(0);opacity:1}75%{transform:translateY(10px);opacity:1}95%,100%{transform:translateY(12px);opacity:0}}@media(prefers-reduced-motion:reduce){.f-crying *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#88B9D4" class=""/><g class="pose"><g class="brows"><path d="M19.5 26.8L25.5 24.8 M38.5 24.8L44.5 26.8" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-3 1Q0-2.5 3 1" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="rou