<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-feverish" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Feverish"><style>.f-feverish .pose{transform-origin:32px 34px;animation:f-feverish-pose 4.8s ease-in-out infinite}@keyframes f-feverish-pose{0%,100%{transform:translateY(0) rotate(-1deg)}55%,72%{transform:translateY(2px) rotate(3deg)}}.f-feverish .lip-motion{transform-origin:0 0;animation:f-feverish-lip-motion 2.4s ease-in-out infinite}@keyframes f-feverish-lip-motion{0%,65%,100%{transform:translateX(0)}20%,36%,52%{transform:translateX(-.35px)}28%,44%,60%{transform:translateX(.35px)}}.f-feverish .thermometer{transform-origin:35px 41px;animation:f-feverish-thermometer 4.8s ease-in-out infinite}@keyframes f-feverish-thermometer{0%,100%{transform:rotate(-1deg)}50%{transform:rotate(1deg)}}.f-feverish .sweat-drop{transform-origin:46px 21px;animation:f-feverish-sweat-drop 4.8s ease-in infinite}@keyframes f-feverish-sweat-drop{0%,10%{transform:translateY(-1px) scale(.45);opacity:.15}35%{transform:translateY(1px) scale(.9);opacity:1}75%{transform:translateY(8px) scale(.85);opacity:1}95%,100%{transform:translateY(10px) scale(.55);opacity:0}}@media(prefers-reduced-motion:reduce){.f-feverish *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#EA7966" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-5 0Q-3-2.5-1 0T3 0T7 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="thermometer"><path d="M35 41L46 44" fill="none" stroke="#F5F3ED" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M38 42L45 43.8" fill="none" stroke="#E23D18" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class=""/><ellipse cx="46" cy="44" rx="1.8" ry="1.8" fill="#E23D18" class=""/></g><g class="sweat-drop"><path d="M46 18C41 24 44 27 46 26C50 26 49 22 46 18Z" fill="#D3F2FA" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></svg>