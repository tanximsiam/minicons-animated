<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-blowing-a-kiss" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Blowing a Kiss"><style>.f-blowing-a-kiss .pose{transform-origin:32px 34px;animation:f-blowing-a-kiss-pose 4.8s ease-in-out infinite}@keyframes f-blowing-a-kiss-pose{0%,70%,100%{transform:translateY(0)}28%{transform:translateY(1.6px)}50%{transform:translateY(0)}}.f-blowing-a-kiss .blink{transform-origin:0 0;animation:f-blowing-a-kiss-blink 4.8s linear infinite}@keyframes f-blowing-a-kiss-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-blowing-a-kiss .lip-motion{transform-origin:0 0;animation:f-blowing-a-kiss-lip-motion 4.8s ease-in-out infinite}@keyframes f-blowing-a-kiss-lip-motion{0%,100%{transform:scale(1)}30%,58%{transform:scale(1.3,.94)}}.f-blowing-a-kiss .wink-open{animation:f-blowing-a-kiss-wink-open 4.8s ease-in-out infinite}@keyframes f-blowing-a-kiss-wink-open{0%,14%,62%,100%{opacity:1}20%,55%{opacity:0}}.f-blowing-a-kiss .wink-closed{animation:f-blowing-a-kiss-wink-closed 4.8s ease-in-out infinite}@keyframes f-blowing-a-kiss-wink-closed{0%,14%,62%,100%{opacity:0}20%,55%{opacity:1}}.f-blowing-a-kiss .kiss-heart{transform-origin:46px 37px;animation:f-blowing-a-kiss-kiss-heart 4.8s ease-out infinite}@keyframes f-blowing-a-kiss-kiss-heart{0%,18%{transform:translate(0,0) scale(.3);opacity:0}30%{opacity:1}75%{transform:translate(7px,-8px) scale(1);opacity:1}95%,100%{transform:translate(8px,-10px) scale(.8);opacity:0}}@media(prefers-reduced-motion:reduce){.f-blowing-a-kiss *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#EC94AC" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="wink-open"/><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stro