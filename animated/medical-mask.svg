<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-medical-mask" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Medical Mask"><style>.f-medical-mask .pose{transform-origin:32px 34px;animation:f-medical-mask-pose 4.8s ease-in-out infinite}@keyframes f-medical-mask-pose{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}.f-medical-mask .blink{transform-origin:0 0;animation:f-medical-mask-blink 4.8s linear infinite}@keyframes f-medical-mask-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-medical-mask .brows{animation:f-medical-mask-brows 4.8s ease-in-out infinite}@keyframes f-medical-mask-brows{0%,100%{transform:translateY(0)}40%,70%{transform:translateY(-.55px)}}.f-medical-mask .mask{transform-origin:32px 39px;animation:f-medical-mask-mask 4.8s ease-in-out infinite}@keyframes f-medical-mask-mask{0%,100%{transform:scale(1)}50%{transform:scale(1.04,1.06)}}@media(prefers-reduced-motion:reduce){.f-medical-mask *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#79C8A4" class=""/><g class="pose"><g class="brows"><path d="M19.5 26.8L25.5 24.8 M38.5 24.8L44.5 26.8" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.35" ry="1.35" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.35" ry="1.35" fill="#2C0E0F" class="blink"/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"></g></g><g class="mask"><path d="M22 34Q32 32 42 34L40 44Q32 48 24 44Z" fill="#F5F3ED" stroke="#C9D9D3" stroke-width="0.7" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M23 35L18 32 M41 35L46 32" fill="none" stroke="#F5F3ED" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M26 36.5H38 M26.5 39H37.5 M27 41.5H37" fill="none" stroke="#B8CFC8" stroke-