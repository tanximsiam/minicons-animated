<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-hurt" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Hurt"><style>.f-hurt .pose{transform-origin:32px 34px;animation:f-hurt-pose 4.8s ease-in-out infinite}@keyframes f-hurt-pose{0%,100%{transform:translateY(0)}14%{transform:translate(-1px,.8px) rotate(-3deg)}25%{transform:translate(1px,.8px) rotate(2deg)}45%,80%{transform:translateY(1.4px)}}.f-hurt .brows{animation:f-hurt-brows 4.8s ease-in-out infinite}@keyframes f-hurt-brows{0%,100%{transform:translateY(0)}40%,70%{transform:translateY(-.55px)}}.f-hurt .lip-motion{transform-origin:0 0;animation:f-hurt-lip-motion 2.4s ease-in-out infinite}@keyframes f-hurt-lip-motion{0%,65%,100%{transform:translateX(0)}20%,36%,52%{transform:translateX(-.35px)}28%,44%,60%{transform:translateX(.35px)}}@media(prefers-reduced-motion:reduce){.f-hurt *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#EC94AC" class=""/><g class="pose"><g class="brows"><path d="M19.5 26.8L25.5 24.8 M38.5 24.8L44.5 26.8" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-3 1Q0-2.5 3 1" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></svg>