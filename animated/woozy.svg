<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-woozy" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Woozy"><style>.f-woozy .pose{transform-origin:32px 34px;animation:f-woozy-pose 2.4s ease-in-out infinite}@keyframes f-woozy-pose{0%,100%{transform:translate(-.7px,0) rotate(-3deg)}50%{transform:translate(.7px,1px) rotate(3deg)}}.f-woozy .blink{transform-origin:0 0;animation:f-woozy-blink 4.8s linear infinite}@keyframes f-woozy-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-woozy .gaze{animation:f-woozy-gaze 4.8s ease-in-out infinite}@keyframes f-woozy-gaze{0%,100%{transform:translateX(-.8px)}40%,70%{transform:translateX(.8px)}}.f-woozy .lip-motion{transform-origin:0 0;animation:f-woozy-lip-motion 2.4s ease-in-out infinite}@keyframes f-woozy-lip-motion{0%,65%,100%{transform:translateX(0)}20%,36%,52%{transform:translateX(-.35px)}28%,44%,60%{transform:translateX(.35px)}}.f-woozy .loose-eye{transform-box:fill-box;transform-origin:center;animation:f-woozy-loose-eye 2.4s ease-in-out infinite}@keyframes f-woozy-loose-eye{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}@media(prefers-reduced-motion:reduce){.f-woozy *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#EA7966" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.2" ry="1.7" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 30)"><g class="loose-eye"><ellipse cx="0" cy="0" rx="3.1" ry="3.5" fill="#2C0E0F" class=""/><ellipse cx="0.7" cy="-1" rx="0.65" ry="0.65" fill="#F5F3ED" class=""/></g></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-5 0Q-3-2.5-1 0T3 0T7 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></svg>