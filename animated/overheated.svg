<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-overheated" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Overheated"><style>.f-overheated .pose{transform-origin:32px 34px;animation:f-overheated-pose 4.8s ease-in-out infinite}@keyframes f-overheated-pose{0%,100%{transform:translateY(0) rotate(-1deg)}55%,72%{transform:translateY(2px) rotate(3deg)}}.f-overheated .lip-motion{transform-origin:0 0;animation:f-overheated-lip-motion 1.2s ease-in-out infinite}@keyframes f-overheated-lip-motion{0%,100%{transform:scale(1,.85)}50%{transform:scale(1,1.15)}}.f-overheated .sweat-drop{transform-origin:46px 21px;animation:f-overheated-sweat-drop 4.8s ease-in infinite}@keyframes f-overheated-sweat-drop{0%,10%{transform:translateY(-1px) scale(.45);opacity:.15}35%{transform:translateY(1px) scale(.9);opacity:1}75%{transform:translateY(8px) scale(.85);opacity:1}95%,100%{transform:translateY(10px) scale(.55);opacity:0}}.f-overheated .tongue{animation:f-overheated-tongue 2.4s ease-in-out infinite}@keyframes f-overheated-tongue{0%,100%{transform:translateY(0)}45%{transform:translate(.4px,1px)}}.f-overheated .heat{animation:f-overheated-heat 2.4s ease-in-out infinite}@keyframes f-overheated-heat{0%,100%{transform:translateY(1px);opacity:.25}45%{transform:translateY(-1.5px);opacity:.8}}@media(prefers-reduced-motion:reduce){.f-overheated *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#E23D18" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-4.5-1.5Q0-2.2 4.5-1.5C4.5 6-4.5 6-4.5-1.5Z" fill="#2C0E0F" st