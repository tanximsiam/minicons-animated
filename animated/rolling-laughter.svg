<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-rolling-laughter" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Rolling Laughter"><style>.f-rolling-laughter .pose{transform-origin:32px 34px;animation:f-rolling-laughter-pose 2.4s ease-in-out infinite}@keyframes f-rolling-laughter-pose{0%,100%{transform:rotate(-13deg)}25%{transform:rotate(-5deg) translateY(-1px)}50%{transform:rotate(7deg)}75%{transform:rotate(-4deg) translateY(-1px)}}.f-rolling-laughter .lip-motion{transform-origin:0 0;animation:f-rolling-laughter-lip-motion 1.2s ease-in-out infinite}@keyframes f-rolling-laughter-lip-motion{0%,100%{transform:scale(1)}25%,75%{transform:scale(1.02,1.19)}50%{transform:scale(1,.92)}}.f-rolling-laughter .joy-left{transform-origin:18px 34px;animation:f-rolling-laughter-joy-left 1.2s ease-out infinite}@keyframes f-rolling-laughter-joy-left{0%,100%{transform:translate(0,-1px) scale(.7);opacity:.25}25%{opacity:1}70%{transform:translate(-4px,5px) scale(1);opacity:1}90%{opacity:0}}.f-rolling-laughter .joy-right{transform-origin:46px 34px;animation:f-rolling-laughter-joy-right 1.2s ease-out infinite}@keyframes f-rolling-laughter-joy-right{0%,100%{transform:translate(0,-1px) scale(.7);opacity:.25}25%{opacity:1}70%{transform:translate(4px,5px) scale(1);opacity:1}90%{opacity:0}}@media(prefers-reduced-motion:reduce){.f-rolling-laughter *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#F9AC1B" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.8-2.7L2 0L-2.8 2.7" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M2.8-2.7L-2 0L2.8 2.7" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-4.5-1.5Q0-2.2 4.5-1.5C4.5 6-4.5 6-4