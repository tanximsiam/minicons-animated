<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-cold-face" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Cold Face"><style>.f-cold-face .pose{transform-origin:32px 34px;animation:f-cold-face-pose 1.6s ease-in-out infinite}@keyframes f-cold-face-pose{0%,70%,100%{transform:translateX(0)}10%,30%,50%{transform:translateX(-.75px)}20%,40%,60%{transform:translateX(.75px)}}.f-cold-face .blink{transform-origin:0 0;animation:f-cold-face-blink 4.8s linear infinite}@keyframes f-cold-face-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-cold-face .lip-motion{transform-origin:0 0;animation:f-cold-face-lip-motion 0.4s ease-in-out infinite}@keyframes f-cold-face-lip-motion{0%,100%{transform:translateY(-.3px)}50%{transform:translateY(.3px)}}.f-cold-face .ice{animation:f-cold-face-ice 0.4s ease-in-out infinite}@keyframes f-cold-face-ice{0%,100%{transform:translateY(0)}50%{transform:translateY(.35px)}}.f-cold-face .frost-patches{animation:f-cold-face-frost-patches 4.8s ease-in-out infinite}@keyframes f-cold-face-frost-patches{0%,100%{opacity:.75}50%{opacity:1}}.f-cold-face .snow-crystal{transform-box:fill-box;transform-origin:center;animation:f-cold-face-snow-crystal 2.4s ease-in-out infinite}@keyframes f-cold-face-snow-crystal{0%,100%{opacity:.55;transform:rotate(-5deg)}50%{opacity:1;transform:rotate(5deg)}}.f-cold-face .snow-specks{animation:f-cold-face-snow-specks 2.4s ease-in-out infinite}@keyframes f-cold-face-snow-specks{0%,100%{transform:translateY(-1px);opacity:.4}50%{transform:translateY(1px);opacity:1}}.f-cold-face .cold-breath{transform-origin:39px 41px;animation:f-cold-face-cold-breath 2.4s ease-out infinite}@keyframes f-cold-face-cold-breath{0%,100%{opacity:0;transform:translateX(0) scale(.7)}30%{opacity:.9}75%{opacity:0;transform:translateX(2.5px) scale(1.15)}}@media(prefers-reduced-motion:reduce){.f-cold-face *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#88B9D4" class=""/><g class="pose"><g class="frost-patches"><path d="M10 17Q14 6 23 5L26 12L31 7L35 14L40 8L44 13L48 10L54 18L48 20L44 16L39 20L34 16L29 20L24 15L19 19L16 15Z" fill="#CFEFF5" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M22 54L26 51L30 55L34 52L38 55L42 52L43 58Q32 64 21 58Z" fill="#CFEFF5" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M11 35L17 32L19 36L15 39Z M47 34L51 31L55 36L49 39Z" fill="#CFEFF5" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.35" ry="1.35" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.35" ry="1.35" fill="#2C0E0F" class="blink"/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-5-2H5V1Q0 5-5 1Z" fill="#F5F3ED" stroke="#2C0E0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-4 .1H4 M-1.7-1.5V2 M1.7-1.5V2" fill="none" stroke="#2C0E0F" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="ice"><path d="M26.5 43V48L28 45 M32 44V51L33.2 47 M37 43V48.5L38.2 45.5" fill="none" stroke="#F5F3ED" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="snow-crystal"><path d="M11.5 23H16.5 M14 20.5V25.5 M12.2 21.2L15.8 24.8 M12.2 24.8L15.8 21.2" fill="none" stroke="#F5F3ED" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="snow-crystal"><path d="M47.5 22H52.5 M50 19.5V24.5 M48.2 20.2L51.8 23.8 M48.2 23.8L51.8 20.2" fill="none" stroke="#F5F3ED" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="snow-specks"><ellipse cx="19" cy="10" rx="0.7" ry="0.7" fill="#F5F3ED" class=""/><ellipse cx="44" cy="12" rx="0.8" ry="0.8" fill="#F5F3ED" class=""/><ellipse cx="10" cy="44" rx="0.7" ry="0.7" fill="#F5F3ED" class=""/></g><g class="cold-breath"><path d="M39 40Q45 37 48 40 M39 43Q45 42 50 44" fill="none" stroke="#F0FAFD" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></svg>