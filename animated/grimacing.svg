<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-grimacing" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Grimacing"><style>.f-grimacing .pose{transform-origin:32px 34px;animation:f-grimacing-pose 1.6s ease-in-out infinite}@keyframes f-grimacing-pose{0%,70%,100%{transform:translateX(0)}10%,30%,50%{transform:translateX(-.75px)}20%,40%,60%{transform:translateX(.75px)}}.f-grimacing .blink{transform-origin:0 0;animation:f-grimacing-blink 4.8s linear infinite}@keyframes f-grimacing-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-grimacing .lip-motion{transform-origin:0 0;animation:f-grimacing-lip-motion 2.4s ease-in-out infinite}@keyframes f-grimacing-lip-motion{0%,100%{transform:scale(1)}25%,55%{transform:scale(1.08,.82)}}@media(prefers-reduced-motion:reduce){.f-grimacing *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#EA7966" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="blink"/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-5-2H5V1Q0 5-5 1Z" fill="#F5F3ED" stroke="#2C0E0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M-4 .1H4 M-1.7-1.5V2 M1.7-1.5V2" fill="none" stroke="#2C0E0F" stroke-width="0.6" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></svg>