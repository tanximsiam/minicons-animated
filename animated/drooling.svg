<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-drooling" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Drooling"><style>.f-drooling .pose{transform-origin:32px 34px;animation:f-drooling-pose 4.8s ease-in-out infinite}@keyframes f-drooling-pose{0%,100%{transform:translateY(0) rotate(-1deg)}55%,72%{transform:translateY(2px) rotate(3deg)}}.f-drooling .lip-motion{transform-origin:0 0;animation:f-drooling-lip-motion 4.8s ease-in-out infinite}@keyframes f-drooling-lip-motion{0%,100%{transform:scale(1)}50%{transform:scale(1,.84)}}.f-drooling .drool-strand{transform-origin:35px 41px;animation:f-drooling-drool-strand 4.8s ease-in-out infinite}@keyframes f-drooling-drool-strand{0%,100%{transform:scaleY(.75);opacity:.65}55%{transform:scaleY(1.05);opacity:1}}@media(prefers-reduced-motion:reduce){.f-drooling *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B6A5D4" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-3-.5Q0 2 3-.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="drool-strand"><path d="M35 41V50Q35 55 37 53Q39 51 36 49" fill="none" stroke="#D3F2FA" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M37 49C32 55 35 58 37 57C41 57 40 53 37 49Z" fill="#D3F2FA" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></svg>