<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-panicked" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Panicked"><style>.f-panicked .pose{transform-origin:32px 34px;animation:f-panicked-pose 1.6s ease-in-out infinite}@keyframes f-panicked-pose{0%,70%,100%{transform:translateX(0)}10%,30%,50%{transform:translateX(-.75px)}20%,40%,60%{transform:translateX(.75px)}}.f-panicked .blink{transform-origin:0 0;animation:f-panicked-blink 4.8s linear infinite}@keyframes f-panicked-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-panicked .gaze{animation:f-panicked-gaze 4.8s ease-in-out infinite}@keyframes f-panicked-gaze{0%,100%{transform:translateX(0)}14%,44%{transform:translateX(-1.7px)}28%,59%{transform:translateX(1.7px)}75%{transform:translateX(0)}}.f-panicked .brows{animation:f-panicked-brows 4.8s ease-in-out infinite}@keyframes f-panicked-brows{0%,100%{transform:translateY(0)}40%,70%{transform:translateY(-.55px)}}.f-panicked .lip-motion{transform-origin:0 0;animation:f-panicked-lip-motion 4.8s ease-in-out infinite}@keyframes f-panicked-lip-motion{0%,100%{transform:scale(1,.86)}20%,50%{transform:scale(1.1,1.18)}65%{transform:scale(1)}}.f-panicked .sweat-drop{transform-origin:46px 21px;animation:f-panicked-sweat-drop 4.8s ease-in infinite}@keyframes f-panicked-sweat-drop{0%,10%{transform:translateY(-1px) scale(.45);opacity:.15}35%{transform:translateY(1px) scale(.9);opacity:1}75%{transform:translateY(8px) scale(.85);opacity:1}95%,100%{transform:translateY(10px) scale(.55);opacity:0}}@media(prefers-reduced-motion:reduce){.f-panicked *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B6A5D4" class=""/><g class="pose"><g class="brows"><path d="M19.5 26.5Q23 26 26 23.5 M38 23.5Q41 26 44.5 26.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.9" ry="3