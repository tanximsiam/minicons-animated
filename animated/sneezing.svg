<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-sneezing" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sneezing"><style>.f-sneezing .pose{transform-origin:32px 34px;animation:f-sneezing-pose 4.8s ease-in-out infinite}@keyframes f-sneezing-pose{0%,100%{transform:translateY(0)}17%{transform:translateY(-1px)}25%{transform:translate(-1px,1.6px) rotate(-3deg)}32%{transform:translate(1px,.4px)}45%,80%{transform:translateY(.7px)}}.f-sneezing .lip-motion{transform-origin:0 0;animation:f-sneezing-lip-motion 4.8s ease-in-out infinite}@keyframes f-sneezing-lip-motion{0%,100%{transform:scale(1,.86)}20%,50%{transform:scale(1.1,1.18)}65%{transform:scale(1)}}.f-sneezing .tissue{animation:f-sneezing-tissue 4.8s ease-in-out infinite}@keyframes f-sneezing-tissue{0%,100%{transform:translate(1px,2px)}22%,42%{transform:translate(-1px,-1px)}65%{transform:translate(0,1px)}}.f-sneezing .sneeze-puff{animation:f-sneezing-sneeze-puff 4.8s ease-in-out infinite}@keyframes f-sneezing-sneeze-puff{0%,20%,55%,100%{opacity:0;transform:translateX(0)}28%{opacity:1}45%{opacity:0;transform:translateX(3px)}}@media(prefers-reduced-motion:reduce){.f-sneezing *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#79C8A4" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.8-2.7L2 0L-2.8 2.7" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M2.8-2.7L-2 0L2.8 2.7" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><ellipse cx="0" cy="0" rx="1.8" ry="2" fill="#2C0E0F" class=""/></g></g><g class="tissue"><path d="M31 38L43 37L46 48L33 47Z" fill="#F5F3ED" stroke="none" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/><path d="M35 39L40