<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-awestruck" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Awestruck"><style>.f-awestruck .pose{transform-origin:32px 34px;animation:f-awestruck-pose 4.8s ease-in-out infinite}@keyframes f-awestruck-pose{0%,100%{transform:translateY(0)}30%,65%{transform:translateY(-1.5px)}}.f-awestruck .blink{transform-origin:0 0;animation:f-awestruck-blink 4.8s linear infinite}@keyframes f-awestruck-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-awestruck .gaze{animation:f-awestruck-gaze 4.8s ease-in-out infinite}@keyframes f-awestruck-gaze{0%,100%{transform:translate(0,0)}28%,68%{transform:translate(.5px,-1.6px)}}.f-awestruck .brows{animation:f-awestruck-brows 4.8s ease-in-out infinite}@keyframes f-awestruck-brows{0%,100%{transform:translateY(0)}40%,70%{transform:translateY(-.55px)}}.f-awestruck .lip-motion{transform-origin:0 0;animation:f-awestruck-lip-motion 4.8s ease-in-out infinite}@keyframes f-awestruck-lip-motion{0%,100%{transform:scale(1,.86)}20%,50%{transform:scale(1.1,1.18)}65%{transform:scale(1)}}@media(prefers-reduced-motion:reduce){.f-awestruck *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B8D56B" class=""/><g class="pose"><g class="brows"><path d="M19.5 25Q23 22.5 26 25 M38 25Q41 22.5 44.5 25" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.9" ry="3.4" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.9" ry="3.4" fill="#2C0E0F" class="blink"/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><ellipse cx="0" cy="0" rx="2.5" ry="3" fill="#2C0E0F" class=""/></g></g></g></svg>