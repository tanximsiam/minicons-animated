<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-yawning" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Yawning"><style>.f-yawning .pose{transform-origin:32px 34px;animation:f-yawning-pose 4.8s ease-in-out infinite}@keyframes f-yawning-pose{0%,100%{transform:translateY(0) rotate(-1deg)}55%,72%{transform:translateY(2px) rotate(3deg)}}.f-yawning .lip-motion{transform-origin:0 0;animation:f-yawning-lip-motion 4.8s ease-in-out infinite}@keyframes f-yawning-lip-motion{0%,100%{transform:scale(.8,.55)}32%,62%{transform:scale(1.1,1.5)}80%{transform:scale(.85,.65)}}.f-yawning .yawn-hand{animation:f-yawning-yawn-hand 4.8s ease-in-out infinite}@keyframes f-yawning-yawn-hand{0%,100%{transform:translateY(4px);opacity:.4}30%,65%{transform:translate(-1px,-2px);opacity:1}}@media(prefers-reduced-motion:reduce){.f-yawning *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B6A5D4" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><ellipse cx="0" cy="0" rx="2.5" ry="3" fill="#2C0E0F" class=""/></g></g><g class="yawn-hand"><ellipse cx="39" cy="45" rx="2.5" ry="4.3" fill="#EA7966" class=""/></g></g></svg>