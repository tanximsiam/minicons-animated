<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-winking" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Winking"><style>.f-winking .pose{transform-origin:32px 34px;animation:f-winking-pose 4.8s ease-in-out infinite}@keyframes f-winking-pose{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}.f-winking .blink{transform-origin:0 0;animation:f-winking-blink 4.8s linear infinite}@keyframes f-winking-blink{0%,80%,90%,100%{transform:scaleY(1)}84%,86%{transform:scaleY(.1)}}.f-winking .wink-open{animation:f-winking-wink-open 4.8s ease-in-out infinite}@keyframes f-winking-wink-open{0%,14%,62%,100%{opacity:1}20%,55%{opacity:0}}.f-winking .wink-closed{animation:f-winking-wink-closed 4.8s ease-in-out infinite}@keyframes f-winking-wink-closed{0%,14%,62%,100%{opacity:0}20%,55%{opacity:1}}@media(prefers-reduced-motion:reduce){.f-winking *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#F9AC1B" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="blink"/></g><g class="" transform="translate(41 31)"><ellipse cx="0" cy="0" rx="2.35" ry="2.15" fill="#2C0E0F" class="wink-open"/><path d="M-2.5 0Q0 3.5 2.5 0" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="wink-closed"/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><path d="M-4-1Q0 3.5 4-1" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></g></svg>