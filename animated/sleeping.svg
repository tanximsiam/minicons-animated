<svg xmlns="http://www.w3.org/2000/svg" class="emoji f-sleeping" viewBox="0 0 64 64" width="64" height="64" role="img" aria-label="Sleeping"><style>.f-sleeping .pose{transform-origin:32px 34px;animation:f-sleeping-pose 4.8s ease-in-out infinite}@keyframes f-sleeping-pose{0%,100%{transform:translateY(0)}50%{transform:translateY(-.7px)}}.f-sleeping .lip-motion{transform-origin:0 0;animation:f-sleeping-lip-motion 4.8s ease-in-out infinite}@keyframes f-sleeping-lip-motion{0%,100%{transform:scale(1)}50%{transform:scale(1,.84)}}.f-sleeping .sleep-z{animation:f-sleeping-sleep-z 4.8s ease-in-out infinite}@keyframes f-sleeping-sleep-z{0%,100%{opacity:0;transform:translateY(2px)}25%,55%{opacity:.9}85%{opacity:0;transform:translateY(-3px)}}.f-sleeping .sleep-1{animation-delay:-1.6s}.f-sleeping .sleep-2{animation-delay:-3.2s}@media(prefers-reduced-motion:reduce){.f-sleeping *{animation:none!important}}</style><ellipse cx="32" cy="32" rx="30" ry="30" fill="#B6A5D4" class=""/><g class="pose"><g class="brows"></g><g class="gaze"><g class="" transform="translate(23 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="" transform="translate(41 31)"><path d="M-2.5 .5H2.5" fill="none" stroke="#2C0E0F" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g><g class="" transform="translate(32 39)"><g class="lip-motion"><ellipse cx="0" cy="0" rx="1.8" ry="2" fill="#2C0E0F" class=""/></g></g><g class="sleep-z sleep-0"><path d="M43 23H46.3L43 26.3H46.3" fill="none" stroke="#2C0E0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="sleep-z sleep-1"><path d="M49 17H53L49 21H53" fill="none" stroke="#2C0E0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class=""/></g><g class="sleep-z sleep-2"><path d="M53 10H57.5L53 14.5H57.5" fill="none" stroke="#2C0E0F" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" class=""/></g></g></svg>